<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca (PHP)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div Class="container">
        <div class="div1">
            <h1>Cadastre um autor</h1>
        </div>
    </div class="container2">
     <div class="container_formulario">
        <form action="http://localhost/biblioteca/back/index.php" method="post">
            <input type="text" name="autorLivro" placeholder="Digite o autor:">
            <br>
            <input type="text" name="descricaoLivro"
            placeholder="Descricao do Livro">
            <br>
            <input type="number" name="anoPublicacao"
            placeholder="Ano de publicação">
            <br>
            <input type="submit" value="Enviar" id="botao">
        </form>
    </div>
</body>
</html>
